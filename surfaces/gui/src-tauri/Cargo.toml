[package]
name = "openworker-desktop"
version = "0.1.0"
description = "OpenWorker desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "openworker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Opens web links in the default browser (openExternal in src/tauri.ts).
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Enterprise refresh token storage (BND-160): the macOS Keychain backend keeps the
# enterprise credential out of secrets.json entirely; on other OSes the crate's
# native backend is used the same way. Values never leave the main process in logs.
# keyring 3.x gates every platform backend behind a feature ("apple-native" selects
# the Keychain store on macOS); without it Entry::new compiles but fails at runtime.
keyring = { version = "3", features = ["apple-native"] }
# Kept outside the Tauri shell so another product can depend on the same local STT engine.
ocw-stt = { path = "../../../stt" }
